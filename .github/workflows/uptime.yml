name: Uptime monitor

# External (GitHub-hosted) liveness check for the production app. Runs
# independently of Railway, so it catches outages Railway's own healthcheck
# can't report to a human. Pings /health on a schedule; on sustained failure it
# opens a tracking issue (and auto-closes it on recovery).
#
# Override the target by setting a repo variable HEALTHCHECK_URL.

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (GitHub's minimum granularity)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (3 attempts, 15s apart)
        id: check
        run: |
          URL="${HEALTHCHECK_URL:-https://inspectra-production.up.railway.app/health}"
          echo "Checking $URL"
          ok=false
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 20 "$URL" || echo "000")
            body=$(cat /tmp/body.txt 2>/dev/null)
            echo "attempt $i → HTTP $code; body: $body"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"status":"ok"'; then
              ok=true; break
            fi
            [ "$i" -lt 3 ] && sleep 15
          done
          if [ "$ok" = "true" ]; then
            echo "status=up" >> "$GITHUB_OUTPUT"
          else
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "::error::Health check failed for $URL"
          fi
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}

      - name: Open tracking issue on outage
        if: steps.check.outputs.status == 'down'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 Production /health is DOWN";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "uptime",
            });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ["uptime"],
                body: `The production \`/health\` check failed (3 consecutive attempts).\n\nDetected by the Uptime monitor workflow: ${run}\n\nThis issue will auto-close once \`/health\` recovers.`,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still down as of ${new Date().toISOString()}. Run: ${run}`,
              });
            }

      - name: Auto-close tracking issue on recovery
        if: steps.check.outputs.status == 'up'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "uptime",
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Recovered — \`/health\` returned 200 at ${new Date().toISOString()}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
            }

      - name: Fail the run if down
        if: steps.check.outputs.status == 'down'
        run: exit 1
