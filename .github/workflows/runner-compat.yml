# Temporary, branch-only tests of immutable candidate commits. No deployment or production secrets.
name: Ubuntu runner compatibility (isolated)
'on':
  push:
    branches:
    - codex/ubuntu-runner-compat-20261017
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: inspectra_ci
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/inspectra_ci
      EMAIL_AUTOMATION_ENABLED: 'false'
      REPORT_NOTIFICATIONS: 'false'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.candidate.sha }}
        persist-credentials: false
    - name: Record exact runner and source
      run: 'cat /etc/os-release

        printf "ImageOS=%s ImageVersion=%s\n" "$ImageOS" "$ImageVersion"

        git rev-parse HEAD

        docker --version

        '
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install PDF text regression tool
      run: sudo apt-get update && sudo apt-get install -y poppler-utils
    - name: Type check
      run: pnpm run check
    - name: Tenant-guard audit (strict)
      run: pnpm run security:tenant-audit:strict
    - name: Apply database schema
      run: npx drizzle-kit migrate
    - name: Run tests
      run: pnpm test
    - name: Build production assets
      run: pnpm run build
    - name: Smoke test built server (isolated, no migrations)
      run: node scripts/smokeBuiltServer.mjs
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - ubuntu-26.04
        candidate:
        - name: main
          sha: 179e8c8c898a8a74309f7a5acece34c971f2c1f6
        - name: audit
          sha: 925f365c688993bad5a74b90ea0ad4c49d442a59
        - name: dependency-pr20
          sha: 8fefdac3fd0053389524b9f6833214c7f20747f4
        - name: ewf-pr19
          sha: 6f229e5e598fe22ee1e7027f2c2c4723a15848ce
    name: test / ${{ matrix.candidate.name }} / ${{ matrix.os }}
  android-build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.candidate.sha }}
        persist-credentials: false
    - name: Record exact runner and source
      run: 'cat /etc/os-release

        printf "ImageOS=%s ImageVersion=%s\n" "$ImageOS" "$ImageVersion"

        git rev-parse HEAD

        docker --version

        '
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Install Android build prerequisites
      run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
    - uses: gradle/actions/setup-gradle@v4
    - name: Build web assets and sync native project
      run: 'pnpm exec vite build

        pnpm exec cap sync android

        '
    - name: Build Android debug APK
      working-directory: android
      run: ./gradlew --no-daemon --stacktrace assembleDebug
    - name: Verify debug artifact
      run: test -s android/app/build/outputs/apk/debug/app-debug.apk
    - name: Android debug build artifact
      uses: actions/upload-artifact@v4
      with:
        name: inspectra-android-debug-${{ matrix.os }}-${{ matrix.candidate.name }}
        path: android/app/build/outputs/apk/debug/app-debug.apk
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - ubuntu-26.04
        candidate:
        - name: main
          sha: 179e8c8c898a8a74309f7a5acece34c971f2c1f6
        - name: audit
          sha: 925f365c688993bad5a74b90ea0ad4c49d442a59
        - name: dependency-pr20
          sha: 8fefdac3fd0053389524b9f6833214c7f20747f4
        - name: ewf-pr19
          sha: 6f229e5e598fe22ee1e7027f2c2c4723a15848ce
    name: android-build / ${{ matrix.candidate.name }} / ${{ matrix.os }}
    env:
      EMAIL_AUTOMATION_ENABLED: 'false'
      REPORT_NOTIFICATIONS: 'false'
  storage-acceptance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: inspectra_ci
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/inspectra_ci
      JWT_SECRET: disposable-storage-acceptance-secret-32-characters
      DISPOSABLE_S3_ACCEPTANCE: 'true'
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: inspectra-ci-acceptance
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: inspectra-ci-access
      S3_SECRET_ACCESS_KEY: inspectra-ci-secret-not-production
      EMAIL_AUTOMATION_ENABLED: 'false'
      REPORT_NOTIFICATIONS: 'false'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.candidate.sha }}
        persist-credentials: false
    - name: Record exact runner and source
      run: 'cat /etc/os-release

        printf "ImageOS=%s ImageVersion=%s\n" "$ImageOS" "$ImageVersion"

        git rev-parse HEAD

        docker --version

        '
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - uses: actions/checkout@v4
      with:
        repository: minio/minio
        ref: 0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
        path: tmp/minio-source
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version: 1.24.2
        cache-dependency-path: tmp/minio-source/go.sum
    - name: Build pinned disposable object storage
      working-directory: tmp/minio-source
      run: 'mkdir -p "$GITHUB_WORKSPACE/tmp/minio-acceptance"

        CGO_ENABLED=0 go build -mod=readonly -tags kqueue -trimpath -o "$GITHUB_WORKSPACE/tmp/minio-acceptance/minio"
        .

        '
    - name: Real storage and HTTP acceptance
      run: node scripts/checkStorageAcceptance.mjs
    - name: MinIO diagnostics
      if: failure()
      run: tail -200 tmp/minio-acceptance/minio.log
    - name: Storage acceptance evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: storage-acceptance-evidence-${{ matrix.os }}-${{ matrix.candidate.name }}
        path: 'tmp/minio-acceptance/*.log

          tmp/minio-acceptance/*.json

          '
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - ubuntu-26.04
        candidate:
        - name: audit
          sha: 925f365c688993bad5a74b90ea0ad4c49d442a59
    name: storage-acceptance / ${{ matrix.candidate.name }} / ${{ matrix.os }}
  payment-acceptance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: inspectra_ci
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/inspectra_ci
      DISPOSABLE_DB_ACCEPTANCE: 'true'
      CHROMIUM_BIN: /usr/bin/google-chrome
      EMAIL_AUTOMATION_ENABLED: 'false'
      REPORT_NOTIFICATIONS: 'false'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.candidate.sha }}
        persist-credentials: false
    - name: Record exact runner and source
      run: 'cat /etc/os-release

        printf "ImageOS=%s ImageVersion=%s\n" "$ImageOS" "$ImageVersion"

        git rev-parse HEAD

        docker --version

        '
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Verify browser prerequisite
      run: test -x "$CHROMIUM_BIN" && "$CHROMIUM_BIN" --version
    - name: Build production assets
      run: pnpm run build
    - name: Real payment browser acceptance
      run: node scripts/checkPaymentBrowser.mjs
    - name: Current-schema synthetic backup and recovery
      env:
        DISPOSABLE_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
      run: node scripts/checkPaymentRestore.mjs
    - name: MySQL diagnostics
      if: failure()
      env:
        DISPOSABLE_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
      run: docker logs "$DISPOSABLE_MYSQL_CONTAINER"
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - ubuntu-26.04
        candidate:
        - name: audit
          sha: 925f365c688993bad5a74b90ea0ad4c49d442a59
    name: payment-acceptance / ${{ matrix.candidate.name }} / ${{ matrix.os }}
  browser-acceptance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.candidate.sha }}
        persist-credentials: false
    - name: Record exact runner and source
      run: 'cat /etc/os-release

        printf "ImageOS=%s ImageVersion=%s\n" "$ImageOS" "$ImageVersion"

        git rev-parse HEAD

        docker --version

        '
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install application dependencies
      run: pnpm install --frozen-lockfile
    - name: Install isolated Chromium acceptance runner
      run: 'python -m pip install playwright==1.62.0

        python -m playwright install --with-deps chromium

        '
    - name: Production component browser acceptance with synthetic HTTP fixtures
      run: python scripts/acceptance/browser_acceptance.py
    - name: Browser acceptance evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-acceptance-evidence-${{ matrix.os }}-${{ matrix.candidate.name }}
        path: tmp/browser-acceptance/
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - ubuntu-26.04
        candidate:
        - name: audit
          sha: 925f365c688993bad5a74b90ea0ad4c49d442a59
    name: browser-acceptance / ${{ matrix.candidate.name }} / ${{ matrix.os }}
    env:
      EMAIL_AUTOMATION_ENABLED: 'false'
      REPORT_NOTIFICATIONS: 'false'
  dependency-audit:
    runs-on: ${{ matrix.os }}
    env: {}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.candidate.sha }}
        persist-credentials: false
    - name: Record exact runner and source
      run: 'cat /etc/os-release

        printf "ImageOS=%s ImageVersion=%s\n" "$ImageOS" "$ImageVersion"

        git rev-parse HEAD

        docker --version

        '
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install without lifecycle scripts
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Audit dependencies
      run: pnpm run security:dependency-audit
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - ubuntu-26.04
        candidate:
        - name: dependency-pr20
          sha: 8fefdac3fd0053389524b9f6833214c7f20747f4
    name: Dependency audit / ${{ matrix.os }}
  monitor-fixtures:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - ubuntu-26.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Record exact runner and source
      run: 'cat /etc/os-release

        printf "ImageOS=%s ImageVersion=%s\n" "$ImageOS" "$ImageVersion"

        git rev-parse HEAD

        docker --version

        '
    - name: Exercise monitor with fake curl and GitHub client
      run: python3 scripts/checkUptimeFixtures.py
