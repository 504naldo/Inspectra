name: Synthetic MySQL timestamp regression
on:
  pull_request:
    paths:
      - scripts/mysql_timestamp_regression.py
      - .github/workflows/mysql-timestamp-synthetic.yml
permissions:
  contents: read
jobs:
  timestamp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ['9.7.2', '9.7.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Check out the proposed test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify normal-runtime timestamp behavior
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          MYSQL_VERSION: ${{ matrix.mysql }}
        run: python3 scripts/mysql_timestamp_regression.py --container "$MYSQL_CONTAINER" --expected-version "$MYSQL_VERSION"
