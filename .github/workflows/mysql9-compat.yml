name: MySQL recovery compatibility (temporary)

on:
  push:
    branches: [codex/mysql9-compat-20261019]
    paths: [.github/workflows/mysql9-compat.yml]

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} / ${{ matrix.mysql }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        mysql: ["mysql:8.0", "mysql:9"]
    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: inspectra_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/inspectra_ci
      EMAIL_AUTOMATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9dbcda16297fb59a3a3b103f9b8a66759ae67b15
          persist-credentials: false
      - name: Record source, hosted runner and disposable database image
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          MYSQL_IMAGE: ${{ matrix.mysql }}
        run: |
          test "$(git rev-parse HEAD)" = "9dbcda16297fb59a3a3b103f9b8a66759ae67b15"
          git rev-parse HEAD
          cat /etc/os-release
          printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          docker inspect --format '{{.Image}}' "$MYSQL_CONTAINER"
          docker image inspect --format '{{json .RepoDigests}}' "$MYSQL_IMAGE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Assert isolated configuration
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const url = new URL(process.env.DATABASE_URL);
          assert.equal(url.hostname, "127.0.0.1");
          assert.equal(url.pathname, "/inspectra_ci");
          assert.equal(url.password, "");
          assert.equal(process.env.EMAIL_AUTOMATION_ENABLED, "false");
          const forbidden = Object.keys(process.env).filter(key =>
            /^(S3_|AWS_ACCESS_KEY|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|RESEND_|OPENAI_API_KEY|GOOGLE_CLIENT_|GOOGLE_REFRESH_TOKEN|GOOGLE_DRIVE_|FIREBASE_|STRIPE_|TWILIO_|BUILT_IN_FORGE_API_KEY|RAILWAY_TOKEN|RAILWAY_API_TOKEN)/.test(key)
            && process.env[key]
          );
          assert.equal(forbidden.length, 0, "Unexpected provider configuration in synthetic CI");
          console.log("Only the isolated loopback database is configured; provider credentials absent.");
          NODE
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Record database runtime version
        run: |
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";
          const connection = await mysql.createConnection(process.env.DATABASE_URL);
          const [rows] = await connection.query("SELECT VERSION() AS mysql_version, DATABASE() AS database_name, @@sql_mode AS sql_mode");
          console.log(JSON.stringify(rows));
          await connection.end();
          NODE
      - name: Install PDF regression tool
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Type check
        run: pnpm run check
      - name: Strict tenant audit
        run: pnpm run security:tenant-audit:strict
      - name: Migrate fresh synthetic database
        run: pnpm exec drizzle-kit migrate
      - name: Full tests including isolated schema recovery
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Isolated built-server smoke
        run: node scripts/smokeBuiltServer.mjs
