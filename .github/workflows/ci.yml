name: CI

on:
  push:
    branches: [main, 'codex/audit-acceptance-*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: inspectra_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/inspectra_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PDF text regression tool
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Type check
        run: pnpm run check

      # Required heuristic check: PR-18's active findings are resolved. Keep
      # authorization tests alongside this audit; a clean scan is not a proof.
      - name: Tenant-guard audit (strict)
        run: pnpm run security:tenant-audit:strict

      - name: Apply database schema
        run: npx drizzle-kit migrate

      - name: Run tests
        run: pnpm test

      - name: Build production assets
        run: pnpm run build

      - name: Smoke test built server (isolated, no migrations)
        run: node scripts/smokeBuiltServer.mjs

  storage-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: inspectra_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/inspectra_ci
      JWT_SECRET: disposable-storage-acceptance-secret-32-characters
      DISPOSABLE_S3_ACCEPTANCE: "true"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: inspectra-ci-acceptance
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: inspectra-ci-access
      S3_SECRET_ACCESS_KEY: inspectra-ci-secret-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Official signed RELEASE.2025-04-22T22-12-26Z source; the historical
      # Docker Hub and Quay image references now require authentication.
      - uses: actions/checkout@v4
        with:
          repository: minio/minio
          ref: 0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
          path: tmp/minio-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: tmp/minio-source/go.sum
      - name: Build pinned disposable object storage
        working-directory: tmp/minio-source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp/minio-acceptance"
          CGO_ENABLED=0 go build -mod=readonly -tags kqueue -trimpath -o "$GITHUB_WORKSPACE/tmp/minio-acceptance/minio" .
      - name: Real storage and HTTP acceptance
        run: node scripts/checkStorageAcceptance.mjs
      - name: MinIO diagnostics
        if: failure()
        run: tail -200 tmp/minio-acceptance/minio.log
      - name: Storage acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-acceptance-evidence
          path: |
            tmp/minio-acceptance/*.log
            tmp/minio-acceptance/*.json

  payment-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: inspectra_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/inspectra_ci
      DISPOSABLE_DB_ACCEPTANCE: "true"
      CHROMIUM_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify browser prerequisite
        run: test -x "$CHROMIUM_BIN" && "$CHROMIUM_BIN" --version
      - name: Build production assets
        run: pnpm run build
      - name: Real payment browser acceptance
        run: node scripts/checkPaymentBrowser.mjs
      - name: Current-schema synthetic backup and recovery
        env:
          DISPOSABLE_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: node scripts/checkPaymentRestore.mjs
      - name: MySQL diagnostics
        if: failure()
        env:
          DISPOSABLE_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: docker logs "$DISPOSABLE_MYSQL_CONTAINER"

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Chromium acceptance runner
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Production component browser acceptance with synthetic HTTP fixtures
        run: python scripts/acceptance/browser_acceptance.py
      - name: Browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-evidence
          path: tmp/browser-acceptance/

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build prerequisites
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build web assets and sync native project
        run: |
          pnpm exec vite build
          pnpm exec cap sync android
      # Build only: the configured APK API host is production. Field acceptance
      # requires a separate authorized device/backend setup before launching it.
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify debug artifact
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Android debug build artifact
        uses: actions/upload-artifact@v4
        with:
          name: inspectra-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
